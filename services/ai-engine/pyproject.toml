[project]
name = "urbangrow-ai-engine"
version = "1.0.0"
description = "UrbanGrow Smart Aquaponic Predictive AI & Climate Adaptation Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "onnxruntime>=1.19.0",
    "joblib>=1.4.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
